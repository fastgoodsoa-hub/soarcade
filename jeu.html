<!doctype html>
<html lang="fr">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frigo Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Style kawaii : frigo menthe à frimousse, étagères pastel, aliments-personnages à contour brun (style sticker). */
:root{
  --ink:#4a3535; --dim:#8a6f6f; --pink:#ff8fb1; --pink-dk:#e86a92; --mint:#bdf0de; --mint-dk:#8fd8bf; --cream:#fffaf2;
  --lav:#e6dcff; --sky:#d9f1ff; --gold:#ffc94d; --berry:#ff6f91;
  --f:'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,#fff 0 6px,transparent 7px) 0 0/46px 46px,radial-gradient(circle at 70% 60%,#ffffffaa 0 4px,transparent 5px) 0 0/60px 60px,linear-gradient(#ffe3ee,#e9defe);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 50px);display:flex;flex-direction:column;gap:10px}

/* frigo */
.fridge{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--mint);border:3.5px solid var(--ink);border-radius:34px 34px 26px 26px;box-shadow:0 7px 0 var(--mint-dk),0 7px 0 3.5px var(--ink),0 16px 30px rgba(120,70,110,.25);position:relative;padding:10px 10px 12px}
.freezer{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px 12px;border-bottom:3.5px solid var(--ink);margin:0 -10px 10px;padding-left:16px;padding-right:16px;position:relative}
.face{display:flex;flex-direction:column;align-items:center;gap:0;flex:none}
.face svg{width:58px;height:30px;display:block}
.pill{background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.timer.low{background:#ffe0e8;color:#d6335c}
.bar{position:absolute;left:16px;right:16px;bottom:-9px;height:12px;border-radius:9px;background:#fff;border:2.5px solid var(--ink);overflow:hidden;z-index:2}
.bar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(-45deg,#ff9ebb 0 8px,#ffb8cc 8px 16px);transition:width .25s linear}
.handle{position:absolute;right:-12px;top:30%;width:10px;height:26%;border-radius:0 10px 10px 0;background:#fff;border:3px solid var(--ink);border-left:0}
.board{flex:1;min-height:0;display:grid;gap:9px;align-content:center;background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:9px;box-shadow:inset 0 5px 0 #fff,inset 0 -8px 16px #f4e7dc}
.cell{position:relative;border-radius:14px;background:linear-gradient(#ffffff,#fff3f7);border:2.5px solid #e8cfd6;display:flex;align-items:flex-end;justify-content:center;padding:2px 3px 9px;min-height:0;overflow:hidden}
.cell::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:7px;border-radius:5px;background:var(--c,#ffc2d4)}
.cell:nth-child(4n+2),.cell:nth-child(4n+3){--c:#bfe9ff}
.cell.target{border-color:#3fbf8a;background:#eafff5}
.cell.full.target{border-color:#ff6f91;background:#fff0f3}
.cell .back{position:absolute;left:0;right:0;top:3px;display:flex;justify-content:space-around;padding:0 36px 0 8px;opacity:.5;filter:saturate(.55);pointer-events:none}
.cell .back .it{width:calc(var(--isz) * .55);height:calc(var(--isz) * .55)}
.cell .slots{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;align-items:end;justify-items:center}
.cell .layers{position:absolute;top:3px;right:5px;z-index:2;font-size:11px;font-weight:700;color:#fff;background:var(--pink);border:2px solid var(--ink);border-radius:99px;padding:0 5px;line-height:15px}
.it{width:var(--isz,40px);height:var(--isz,40px);cursor:grab;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.it svg{width:100%;height:100%;display:block;overflow:visible}
.slots .it svg{animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.it.sel{transform:translateY(-9px) scale(1.15) rotate(-5deg)}
.it.hint{animation:hint .5s ease-in-out infinite alternate}
@keyframes hint{to{transform:translateY(-7px) scale(1.15) rotate(6deg)}}
.it.drop{animation:drop .3s ease-out}
@keyframes drop{0%{transform:scale(1.25,.75)}60%{transform:scale(.92,1.1)}100%{transform:none}}
.it.pop{animation:pop .35s ease-in forwards}
@keyframes pop{40%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(0) rotate(-20deg);opacity:0}}
.drag{position:fixed;z-index:50;pointer-events:none;width:calc(var(--isz,40px) * 1.3);height:calc(var(--isz,40px) * 1.3);transform:translate(-50%,-70%) rotate(-6deg);filter:drop-shadow(0 8px 5px rgba(120,70,110,.3))}
.drag svg{width:100%;height:100%;overflow:visible}

/* aides */
.tools{display:flex;gap:10px;justify-content:center;padding-top:4px}
.tool{flex:1;max-width:150px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:5px 4px 4px;font:600 14px var(--f);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;position:relative}
.tool:nth-child(1){background:#fff6cf}.tool:nth-child(2){background:#e3f4ff}.tool:nth-child(3){background:#ffe6ef}
.tool svg{width:24px;height:24px}
.tool b{position:absolute;top:-9px;right:-6px;background:var(--berry);color:#fff;border:2px solid var(--ink);border-radius:99px;min-width:24px;height:24px;font-size:13px;line-height:20px}
.tool[disabled]{opacity:.45}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.float{position:fixed;z-index:40;pointer-events:none;font:700 21px var(--f);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:up .9s ease-out forwards;white-space:nowrap}
@keyframes up{0%{transform:scale(.6)}20%{transform:scale(1.1)}100%{transform:translateY(-50px);opacity:0}}
.spark{position:fixed;z-index:39;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(160deg) scale(.3);opacity:0}}

/* écrans */
.ov{position:fixed;inset:0;z-index:60;background:rgba(90,50,80,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--cream);border:3.5px solid var(--ink);border-radius:28px;padding:22px 20px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 var(--ink)}
.card h1,.card h2{font-weight:700;margin:0;line-height:1;color:var(--ink);text-wrap:balance}
.card h1{font-size:clamp(38px,11vw,50px)} .card h1 b{color:var(--pink-dk);font-weight:700}
.card h2{font-size:32px}
.card p{margin:0;color:var(--dim);font-size:16px;line-height:1.4;font-weight:500}
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:46px;height:46px}
.btn{font:700 19px var(--f);border:3px solid var(--ink);border-radius:18px;padding:11px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-shadow:0 2px 0 var(--pink-dk)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.demo{display:flex;justify-content:center;gap:4px}
.demo .it{width:64px;height:64px}
.demo .it svg{animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){.it,.it svg,.it.pop,.it.hint,.it.drop,.float,.spark{animation:none!important;transition:none}}
/* tapis roulant (v3) */
.cell{padding:2px 3px 10px}
.hearts{display:flex;gap:2px}.hearts svg{width:20px;height:20px}
.hearts .off{opacity:.25;filter:grayscale(1)}
.bar i{background:repeating-linear-gradient(-45deg,#7fd9b4 0 8px,#a6ecd0 8px 16px)}
.goal{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);z-index:3;background:#fff;border:2.5px solid var(--ink);border-radius:99px;font-size:12px;font-weight:700;padding:0 8px;line-height:17px;white-space:nowrap}
.belt{flex:none;height:clamp(78px,12.5vh,104px);position:relative;border:3.5px solid var(--ink);border-radius:22px;background:#f9e6ef;box-shadow:0 5px 0 var(--ink);overflow:hidden;touch-action:none}
.track{position:absolute;left:0;right:0;bottom:8px;height:30%;background:repeating-linear-gradient(90deg,#8d7f8f 0 16px,#7a6d7c 16px 32px);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.rollers{position:absolute;left:0;right:0;bottom:0;height:8px;background:radial-gradient(circle at 8px 4px,#4a3535 0 3px,transparent 3.5px) 0 0/22px 8px}
.chute{position:absolute;left:0;top:0;bottom:0;width:46px;z-index:3;background:linear-gradient(90deg,#ffd6e2,#ffd6e200);display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 4px 4px;pointer-events:none}
.chute svg{width:30px;height:34px}
.hatch{position:absolute;right:0;top:0;bottom:0;width:22px;z-index:3;background:#c8f1e4;border-left:3px solid var(--ink)}
.bi{position:absolute;left:0;bottom:calc(8px + 30% - 6px);width:var(--bsz,56px);height:var(--bsz,56px);z-index:2;cursor:grab;will-change:transform}
.bi svg{width:100%;height:100%;display:block;overflow:visible}
.bi.sel svg{transform:translateY(-6px) scale(1.12);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 0 #ff8fb1)}
.bi.danger svg{animation:shake .25s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bi.fall svg{animation:fall .5s ease-in forwards}
@keyframes fall{to{transform:translate(-20px,60px) rotate(-60deg);opacity:0}}
.bi.hold{visibility:hidden}
.cell .slots .it.empty{visibility:visible;opacity:0}
.tool:nth-child(1){background:#e3f4ff}.tool:nth-child(2){background:#fff6cf}.tool:nth-child(3){background:#ffe6ef}
.shake-h{animation:hh .4s}
@keyframes hh{25%{transform:scale(1.3)}}
.warn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:#ff6f91;color:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 16px;font-weight:700;font-size:20px;text-align:center;box-shadow:0 5px 0 var(--ink);pointer-events:none;animation:pulse .5s ease-in-out infinite alternate;white-space:nowrap}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.06)}}
.fridge{position:relative}
.belt.drop-ok{background:#eafff5}
</style>
</head>
<body>
<div class="app">
  <div class="fridge">
    <div class="handle"></div>
    <div class="freezer">
      <span class="pill"><small>Niv.</small><span id="lvl">1</span></span>
      <span class="face" aria-hidden="true"><svg viewBox="-29 -15 58 30" id="fface"></svg></span>
      <span class="pill hearts" id="hearts" aria-label="Vies"></span>
      <div class="bar"><i id="tbar"></i></div>
      <span class="goal" id="goal">2:00 · 30 à ranger</span>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div class="belt" id="belt">
    <div class="track" id="track"></div><div class="rollers" id="rollers"></div>
    <div class="chute" aria-hidden="true"><svg viewBox="0 0 30 34" fill="#fff" stroke="#4a3535" stroke-width="2.4" stroke-linejoin="round"><path d="M4 10h22l-2 21H6z"/><path d="M2 7h26M11 4h8" stroke-linecap="round"/><path d="M11 15v11M19 15v11" stroke-linecap="round"/></svg></div>
    <div class="hatch" aria-hidden="true"></div>
  </div>
  <div class="tools">
    <button class="tool" id="tSlow" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#4a3535" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 3 3-3M9 20l3-3 3 3"/></svg>Ralentir<b id="nSlow">2</b></button>
    <button class="tool" id="tHelp" type="button"><svg viewBox="0 0 24 24" fill="#ffe066" stroke="#4a3535" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Coup de main<b id="nHelp">2</b></button>
    <button class="tool" id="tTime" type="button"><svg viewBox="0 0 24 24" fill="#ffd1df" stroke="#4a3535" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>+20 s<b id="nTime">1</b></button>
  </div>
</div>
<div class="ov" id="ov"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<script>

  G.cells.forEach((st, ci) => { const row = st[0]; if (!row.includes(null)) return; const same = row.filter(x => x === k).length, filled = row.filter(Boolean).length;
    const sc = same === 2 ? 4 : same === 1 && filled === 1 ? 3 : filled === 0 ? 2 : same === 1 ? 1 : 0; if (sc > bs) { bs = sc; best = ci; } });
  return best;
}
function win() {
  if (G.over) return; G.over = true; sfx.win();
  const stars = Math.max(1, G.hearts - (G.time / G.max < .2 ? 1 : 0)), bonus = G.hearts * 50 + Math.round(G.time) * 3;
  G.score += bonus; save.level = Math.max(save.level, G.n + 1); save.best = Math.max(save.best, G.score); store(); updateHud();
  sparkle(innerWidth / 2, innerHeight / 2 - 80, 16);
  const happy = shuffle(G.kinds.slice()).slice(0, 3);
  show(`<h2>Frigo rangé !</h2><div class="demo">${happy.map((k, i) => `<span class="it" style="--d:${-i * .3}s">${sprite(k)}</span>`).join('')}</div><div class="stars">${[0, 1, 2].map(i => STAR(i < stars)).join('')}</div><p>Bonus +${bonus} · score ${G.score}</p><button class="btn" data-next>Niveau ${G.n + 1}</button><button class="btn alt" data-again>Rejouer ce niveau</button>`);
}
function lose(why) {
  if (G.over) return; G.over = true; sfx.lose();
  const msg = { fall: 'Trois aliments sont tombés du tapis.', time: 'Le chrono est arrivé à zéro.', full: 'Le frigo est resté plein trop longtemps.' }[why];
  show(`<h2>Oh non !</h2><div class="demo"><span class="it">${sprite('tofu', true)}</span></div><p>${msg} Il restait ${G.left} aliments à ranger.</p><button class="btn" data-again>Réessayer</button><button class="btn alt" data-home>Accueil</button>`);
}

/* ---------- glisser-déposer et toucher ---------- */
let drag = null;
function refreshBeltSel() { G.belt.forEach(b => b.el.classList.toggle('sel', !!(G.sel && G.sel.from === 'belt' && G.sel.id === b.id))); }
function startPress(e, src) { drag = { ...src, x0: e.clientX, y0: e.clientY, moved: false, ghost: null }; }
beltEl.addEventListener('pointerdown', e => {
  audio(); if (!G || G.over) return; e.preventDefault();
  const el = e.target.closest('.bi'); if (!el) { if (G.sel && G.sel.from === 'shelf') { toBelt(G.sel, e.clientX); return; } G.sel = null; refreshBeltSel(); render(); return; }
  const b = G.belt.find(x => x.id === +el.dataset.id); if (!b || b.fall) return;
  startPress(e, { from: 'belt', id: b.id, k: b.k });
});
board.addEventListener('pointerdown', e => {
  audio(); if (!G || G.over) return; e.preventDefault();
  const it = e.target.closest('.slots .it');
  if (it && it.dataset.k) { startPress(e, { from: 'shelf', ci: +it.dataset.ci, si: +it.dataset.si, k: it.dataset.k }); return; }
  const c = e.target.closest('.cell'); if (c && G.sel) tryMove(G.sel, +c.dataset.ci, it ? +it.dataset.si : undefined);
});
addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    drag.moved = true; drag.ghost = document.createElement('div'); drag.ghost.className = 'drag'; drag.ghost.innerHTML = sprite(drag.k); document.body.appendChild(drag.ghost); sfx.pick();
    if (drag.from === 'belt') { const b = G.belt.find(x => x.id === drag.id); if (b) b.el.classList.add('hold'); }
    else { const src = board.querySelector(`.slots .it[data-ci="${drag.ci}"][data-si="${drag.si}"]`); if (src) src.style.visibility = 'hidden'; }
  }
  if (drag.moved) {
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    const t = cellAt(e.clientX, e.clientY); board.querySelectorAll('.cell').forEach(c => c.classList.remove('target', 'full'));
    if (t >= 0 && !(drag.from === 'shelf' && t === drag.ci)) { const c = board.children[t]; c.classList.add('target'); if (!front(t).includes(null)) c.classList.add('full'); }
    beltEl.classList.toggle('drop-ok', drag.from === 'shelf' && overBelt(e.clientX, e.clientY));
  }
});
function cancelDrag() {
  if (!drag) return; const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  board.querySelectorAll('.cell').forEach(c => c.classList.remove('target', 'full')); beltEl.classList.remove('drop-ok');
  if (d.from === 'belt') { const b = G.belt.find(x => x.id === d.id); if (b) b.el.classList.remove('hold'); }
  else render();
}
function endPress(e) {
  if (!drag) return; const d = drag;
  if (!d.moved) {
    drag = null;
    if (d.from === 'belt') { G.sel = G.sel && G.sel.from === 'belt' && G.sel.id === d.id ? null : { from: 'belt', id: d.id }; sfx.pick(); refreshBeltSel(); render(); return; }
    if (G.sel && !(G.sel.from === 'shelf' && G.sel.ci === d.ci)) { tryMove(G.sel, d.ci, d.si); return; }
    G.sel = G.sel && G.sel.from === 'shelf' && G.sel.ci === d.ci && G.sel.si === d.si ? null : { from: 'shelf', ci: d.ci, si: d.si }; sfx.pick(); refreshBeltSel(); render(); return;
  }
  const t = cellAt(e.clientX, e.clientY);
  cancelDrag();
  if (d.from === 'shelf' && overBelt(e.clientX, e.clientY)) { toBelt({ from: 'shelf', ci: d.ci, si: d.si }, e.clientX); return; }
  if (t >= 0) tryMove(d.from === 'belt' ? { from: 'belt', id: d.id } : { from: 'shelf', ci: d.ci, si: d.si }, t, slotAt(t, e.clientX));
}
addEventListener('pointerup', endPress); addEventListener('pointercancel', () => cancelDrag());
function overBelt(x, y) { const r = beltEl.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top - 10 && y <= r.bottom; }
function cellAt(x, y) { const els = board.children; for (let i = 0; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (x >= r.left - 4 && x <= r.right + 4 && y >= r.top - 4 && y <= r.bottom + 4) return i; } return -1; }
function slotAt(ci, x) { const r = board.children[ci].getBoundingClientRect(); return Math.min(2, Math.max(0, Math.floor((x - r.left) / r.width * 3))); }

/* ---------- aides ---------- */
$('#tSlow').addEventListener('click', () => { audio(); if (!G.tools.slow || G.over) return; G.tools.slow--; G.slowT = 7; const r = beltEl.getBoundingClientRect(); floatText('Tout doux…', r.left + r.width / 2 - 50, r.top - 10); updateHud(); });
$('#tHelp').addEventListener('click', () => { audio(); if (!G.tools.help || G.over) return;
  const belt = G.belt.filter(x => !x.fall && !(drag && drag.from === 'belt' && drag.id === x.id)).sort((a, c) => a.x - c.x);
  // 1) compléter une paire déjà posée
  for (let a = 0; a < G.cells.length; a++) { const ra = front(a); if (!ra.includes(null)) continue; const cnt = {}; ra.forEach(x => { if (x) cnt[x] = (cnt[x] || 0) + 1; });
    for (const k in cnt) if (cnt[k] === 2) {
      const b = belt.find(x => x.k === k); if (b) { G.tools.help--; tryMove({ from: 'belt', id: b.id }, a); updateHud(); return; }
      for (let c = 0; c < G.cells.length; c++) if (c !== a) { const si = front(c).indexOf(k); if (si >= 0) { G.tools.help--; tryMove({ from: 'shelf', ci: c, si }, a); updateHud(); return; } } } }
  // 2) sinon ranger l'aliment du tapis le plus pressé
  const b = belt[0]; if (!b) { floatText('Rien à ranger', innerWidth / 2 - 50, innerHeight / 2); return; }
  const ci = bestShelf(b.k); if (ci < 0) { floatText('Frigo plein !', innerWidth / 2 - 50, innerHeight / 2); sfx.no(); return; }
  G.tools.help--; tryMove({ from: 'belt', id: b.id }, ci); updateHud(); });
$('#tTime').addEventListener('click', () => { audio(); if (!G.tools.time || G.over) return; G.tools.time--; G.time = Math.min(G.max, G.time + 20); floatText('+20 s', innerWidth / 2 - 30, innerHeight / 3); updateHud(); });

/* ---------- écrans ---------- */
function show(h) { const o = $('#ov'); o.innerHTML = `<div class="card">${h}</div>`; o.hidden = false; }
$('#ov').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; audio(); const d = b.dataset;
  if (d.play !== undefined) { $('#ov').hidden = true; newLevel(save.level); }
  if (d.next !== undefined) { $('#ov').hidden = true; newLevel(G.n + 1); }
  if (d.again !== undefined) { $('#ov').hidden = true; newLevel(G.n); }
  if (d.restart !== undefined) { save.level = 1; store(); $('#ov').hidden = true; newLevel(1); }
  if (d.home !== undefined) home();
});
function home() { show(`<h1>Frigo <b>Express</b></h1><div class="demo">${['avocat', 'avocat', 'avocat'].map((k, i) => `<span class="it" style="--d:${-i * .25}s">${sprite(k)}</span>`).join('')}</div><p>Vide le frigo et le tapis avant la fin du chrono. Trois aliments identiques sur la même étagère disparaissent, et ceux du fond avancent. Tu peux poser un aliment du frigo sur le tapis pour faire de la place, mais s'il tombe au bout, tu perds un cœur.</p><button class="btn" data-play>${save.level > 1 ? 'Continuer · niveau ' + save.level : 'Jouer'}</button>${save.level > 1 ? '<button class="btn alt" data-restart>Recommencer au niveau 1</button>' : ''}${save.best ? `<p>Meilleur score : ${save.best}</p>` : ''}`); }

const warnEl = document.createElement('div'); warnEl.className = 'warn'; warnEl.hidden = true; document.querySelector('.fridge').appendChild(warnEl);
let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, .1); last = t;
  if (G && !G.over && $('#ov').hidden && !document.hidden) { if (G.comboT > 0) G.comboT -= dt; if (G.slowT > 0) G.slowT -= dt; stepBelt(dt);
    G.time -= dt; if (G.time <= 0) { G.time = 0; lose('time'); }
    if (fridgeFull()) { G.fullT += dt; const left = Math.ceil(5 - G.fullT); warnEl.hidden = false; warnEl.textContent = `Frigo plein ! ${left}`; if (G.fullT >= 5) lose('full'); } else { G.fullT = 0; warnEl.hidden = true; }
    updateHud(); } else if (warnEl) warnEl.hidden = true;
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { if (G) render(); });
newLevel(save.level); home(); requestAnimationFrame(loop);
})();
</script>
