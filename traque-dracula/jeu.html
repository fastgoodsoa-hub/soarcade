<!doctype html><html lang="fr"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>La Traque de Dracula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout : course plein écran vue de dos, HUD en pastilles arrondies (cœurs à gauche, chapitre et progression au centre,
   pièces et pause à droite, bonus en réserve à droite en bas, bonus actif au centre en bas). Un seul thème, sombre. */
:root{
  --night:#120a1c; --panel:rgba(22,10,30,.8); --blood:#e0284a; --blood-dk:#8a0f2a; --bone:#fff4e0; --dim:#c8b8d8; --gold:#ffc83a; --gold-dk:#c98a10; --line:rgba(255,255,255,.16); --green:#b6ff6a;
  --f-title:'Creepster', 'Impact', fantasy;
  --f-ui:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--bone);font-family:var(--f-ui);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
:root{padding:0!important}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px;pointer-events:none;z-index:5}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 10px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.hearts{justify-self:start;display:flex;gap:1px;font-size:20px;line-height:1.2;color:var(--blood);text-shadow:0 2px 0 var(--blood-dk)}
.hearts .off{color:#4a3050;text-shadow:none}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chap{font-weight:800;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.prog{width:min(38vw,200px);height:9px;background:rgba(0,0,0,.5);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(var(--gold),var(--gold-dk));border-radius:99px}
.prog.boss i{background:linear-gradient(#ff5470,var(--blood-dk))}
.right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.coins{font-weight:800;font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.5);display:flex;align-items:center;gap:6px;line-height:1.25}
.coins::before{content:"";width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,var(--gold) 45%,var(--gold-dk));box-shadow:0 0 0 2px #7a4a08}
#pauseBtn{pointer-events:auto;font:800 14px var(--f-ui);color:var(--bone);background:var(--panel);border:2px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#power{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);border-radius:16px;padding:6px 16px 8px;display:flex;flex-direction:column;gap:5px;align-items:center;min-width:170px;z-index:5;pointer-events:none}
#power b{font-size:15px;font-weight:800}
#power .bar{width:100%;height:6px;background:rgba(0,0,0,.5);border-radius:9px;overflow:hidden}#power .bar i{display:block;height:100%;background:var(--gold)}
#reserve{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px;z-index:6}
#reserve button{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.7);font:800 11px/1.05 var(--f-ui);color:#1a0d22;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);position:relative;padding:4px}
#reserve button[disabled]{opacity:.4}
#reserve button b{position:absolute;top:-6px;right:-6px;background:var(--blood);color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:12px;line-height:20px;border:2px solid #fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:8px 16px;text-align:center;z-index:6;pointer-events:none;transition:opacity .4s;max-width:88vw;width:max-content}
#toast b{display:block;font-size:17px;color:var(--gold)} #toast span{font-size:14px;color:var(--bone)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);font-size:16px;font-weight:800;text-align:center;text-shadow:0 2px 4px #000;z-index:5;pointer-events:none;transition:opacity .6s;width:max-content;max-width:80vw;line-height:1.3}
#flash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,var(--blood));opacity:0;pointer-events:none;z-index:4}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .45s}
.scr{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto;
  background:radial-gradient(ellipse at 50% 25%,rgba(122,74,216,.32),rgba(10,5,16,.86) 70%)}
.card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;margin:auto}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-family:var(--f-title);font-weight:400;font-size:clamp(46px,13vw,84px);line-height:.92;margin:0;color:var(--green);text-shadow:0 0 20px rgba(140,255,90,.35),0 5px 0 #2a5a10,0 8px 18px rgba(0,0,0,.6);letter-spacing:.02em;text-wrap:balance}
h1 span{display:block;color:var(--blood);text-shadow:0 0 18px rgba(224,40,74,.45),0 5px 0 #4a0616,0 8px 18px rgba(0,0,0,.6)}
h2{font-family:var(--f-title);font-weight:400;font-size:clamp(34px,8.5vw,50px);margin:0;line-height:1;color:var(--bone);text-shadow:0 4px 0 var(--blood-dk);letter-spacing:.02em;text-wrap:balance}
.card p{margin:0;color:#eadcf0;font-size:16px;line-height:1.45;max-width:42ch}
.btns{display:flex;flex-direction:column;gap:10px;width:min(100%,320px)}
.row{display:flex;gap:10px;width:min(100%,320px)} .row .btn{flex:1}
.btn{font:800 19px var(--f-ui);color:#2a1606;background:linear-gradient(#ffe070,var(--gold));border:0;box-shadow:0 5px 0 var(--gold-dk),0 8px 14px rgba(0,0,0,.4);padding:11px 18px;cursor:pointer;border-radius:16px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dk)}
.btn.shopb{background:linear-gradient(#ff7a94,var(--blood));color:#fff;box-shadow:0 5px 0 var(--blood-dk),0 8px 14px rgba(0,0,0,.4)}
.btn.alt{background:rgba(255,255,255,.08);color:var(--bone);box-shadow:0 4px 0 rgba(0,0,0,.4);border:2px solid var(--line);font-weight:700;font-size:17px}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.small{font-size:14px!important;color:var(--dim)!important}
.map{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.map span{width:22px;height:8px;border-radius:9px;background:rgba(255,255,255,.12)}
.map span.on{background:var(--gold)} .map span.now{background:var(--green)}
.keys{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:15px;color:#eadcf0;text-align:left}
.keys b{color:var(--gold);font-weight:800}
.purse{font-weight:800;color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums}
.section{width:100%;text-align:left;font-weight:800;font-size:18px;margin-top:4px;color:var(--green)}
.shop{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
@media(max-width:460px){.shop{grid-template-columns:1fr}}
.item{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.item b{font-size:16px}.item span{font-size:14px;color:var(--dim);line-height:1.3}
.item .lv{display:flex;gap:4px;margin:2px 0}.item .lv i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.14)}.item .lv i.on{background:var(--gold)}
.item .acts{display:flex;gap:6px;margin-top:6px}
.item button{flex:1;font:800 14px var(--f-ui);color:#2a1606;background:var(--gold);border:0;padding:7px 6px;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 var(--gold-dk);line-height:1.15}
.item button[disabled]{background:#3a2a44;color:var(--dim);cursor:default;box-shadow:none}
.item.sel{border-color:var(--gold)}
.sw{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.legend{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.legend div{background:var(--panel);border-radius:14px;padding:8px 12px;border:2px solid var(--line)}
.legend b{font-size:16px}.legend span{display:block;font-size:14px;color:var(--dim)}
.loadbar{width:min(80vw,280px);height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.loadbar i{display:block;height:100%;width:0;background:var(--gold)}
</style>

<canvas id="gl"></canvas>
<div id="hud" hidden>
  <div class="hearts pill" id="hearts"></div>
  <div class="mid"><div class="chap" id="chap"></div><div class="prog" id="prog"><i id="progI"></i></div></div>
  <div class="right"><span class="coins pill" id="coins">0</span><button id="pauseBtn" type="button" aria-label="Pause">II</button></div>
</div>
<div id="power" class="pill" hidden><b id="powName"></b><div class="bar"><i id="powBar"></i></div></div>
<div id="reserve" hidden></div>
<div id="toast" style="opacity:0"><b id="toastT"></b><span id="toastD"></span></div>
<div id="hint"></div>
<div id="flash"></div><div id="fade"></div>
<div id="scr" class="scr"><div class="card"><div class="eyebrow">Londres · 1897</div><h1>La Traque<span>de Dracula</span></h1><p>Chargement des décors et des personnages…</p><div class="loadbar"><i id="loadI"></i></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'traque-dracula-v3';
const LANE = 2.2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- Sauvegarde ---------- */
const S = (() => {
  const d = { coins: 0, reached: 0, hearts: 0, lv: { inv: 0, vol: 0, aim: 0, x2: 0, pis: 0 }, res: { inv: 0, vol: 0, aim: 0, x2: 0, pis: 0 }, gun: false, skins: ['chasseur'], skin: 'chasseur', wins: 0, sound: true, seenBonus: false };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) { Object.assign(d, s); d.lv = Object.assign({ inv: 0, vol: 0, aim: 0, x2: 0, pis: 0 }, s.lv); d.res = Object.assign({ inv: 0, vol: 0, aim: 0, x2: 0, pis: 0 }, s.res); } } catch (e) {}
  return d;
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const maxHearts = () => 3 + S.hearts;
const powDur = k => 6 + S.lv[k] * 2;
const diffMul = () => 1 + 0.08 * Math.min(S.wins, 4);

/* ---------- Son ---------- */
let AC = null;
function ensureAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } }
function tone(f, d, type = 'square', vol = .04, slide = 0, delay = 0) {
  if (!S.sound || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
let lastCoin = 0;
function sfx(k) {
  if (!AC) return;
  switch (k) {
    case 'coin': if (AC.currentTime - lastCoin < .05) return; lastCoin = AC.currentTime; tone(1320, .06, 'square', .025); tone(1760, .08, 'square', .02, 0, .045); break;
    case 'jump': tone(380, .14, 'triangle', .07, 260); break;
    case 'slide': tone(260, .14, 'sawtooth', .025, -120); break;
    case 'hit': tone(150, .35, 'sawtooth', .09, -90); break;
    case 'pow': [523, 659, 784, 1047].forEach((f, i) => tone(f, .1, 'square', .04, 0, i * .07)); break;
    case 'arrive': [392, 523, 659, 784].forEach((f, i) => tone(f, .18, 'triangle', .07, 0, i * .12)); break;
    case 'shot': tone(900, .05, 'square', .02, -500); break;
    case 'boss': tone(260, .09, 'square', .05, -150); break;
    case 'over': [330, 262, 220, 165].forEach((f, i) => tone(f, .28, 'triangle', .07, 0, i * .2)); break;
    case 'buy': tone(784, .06, 'square', .04); tone(1175, .1, 'square', .04, 0, .06); break;
  }
}

/* ---------- Rendu ---------- */
const canvas = $('#gl');
const isTouch = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.6 : 2));
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, 1, .1, 700);
const hemi = new THREE.HemisphereLight(0xffffff, 0x404040, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(-4, 10, 6); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0); rim.position.set(0, 6, -12); scene.add(rim);
const world = new THREE.Group(); scene.add(world);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < h ? 70 : 54; cam.updateProjectionMatrix(); }
addEventListener('resize', resize);

const BEND = { value: .0016 };
const PROJ = `vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_INSTANCING
mvPosition = instanceMatrix * mvPosition;
#endif
mvPosition = modelViewMatrix * mvPosition;
mvPosition.y -= mvPosition.z * mvPosition.z * uBend;
gl_Position = projectionMatrix * mvPosition;`;
const bendVS = vs => 'uniform float uBend;\n' + vs.replace('#include <project_vertex>', PROJ);
function bend(m) { m.onBeforeCompile = sh => { sh.uniforms.uBend = BEND; sh.vertexShader = bendVS(sh.vertexShader); }; return m; }
function bendSprite(m) { m.onBeforeCompile = sh => { sh.uniforms.uBend = BEND; sh.vertexShader = 'uniform float uBend;\n' + sh.vertexShader.replace('gl_Position = projectionMatrix * mvPosition;', 'mvPosition.y -= mvPosition.z * mvPosition.z * uBend;\ngl_Position = projectionMatrix * mvPosition;'); }; return m; }

const MC = {}, GC = {};
function M(c, e) { const k = c + '|' + (e || 0); return MC[k] || (MC[k] = bend(new THREE.MeshLambertMaterial({ color: c, emissive: e ? c : 0, emissiveIntensity: e || 0 }))); }
function geo(k, f) { return GC[k] || (GC[k] = f()); }
function mesh(g, c, x, y, z, e) { const m = new THREE.Mesh(g, typeof c === 'number' ? M(c, e) : c); m.position.set(x || 0, y || 0, z || 0); return m; }
function roundGeo(w, h, d, r) {
  const g = new THREE.BoxGeometry(w, h, d, 3, 3, 3), p = g.attributes.position, v = new THREE.Vector3(), c = new THREE.Vector3();
  const hw = Math.max(w / 2 - r, 0), hh = Math.max(h / 2 - r, 0), hd = Math.max(d / 2 - r, 0);
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); c.set(clamp(v.x, -hw, hw), clamp(v.y, -hh, hh), clamp(v.z, -hd, hd)); v.sub(c); if (v.lengthSq() > 1e-8) v.normalize().multiplyScalar(r); v.add(c); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
const rb = (w, h, d, r, c, x, y, z, e) => mesh(geo('rb' + [w, h, d, r], () => roundGeo(w, h, d, r)), c, x, y, z, e);
const box = (w, h, d, c, x, y, z, e) => mesh(geo('b' + [w, h, d], () => new THREE.BoxGeometry(w, h, d)), c, x, y, z, e);
const cyl = (rt, rbt, h, s, c, x, y, z, e) => mesh(geo('c' + [rt, rbt, h, s], () => new THREE.CylinderGeometry(rt, rbt, h, s)), c, x, y, z, e);
const cone = (r, h, s, c, x, y, z, e) => mesh(geo('k' + [r, h, s], () => new THREE.ConeGeometry(r, h, s)), c, x, y, z, e);
const sph = (r, c, x, y, z, e) => mesh(geo('s' + r, () => new THREE.SphereGeometry(r, 14, 10)), c, x, y, z, e);
const tor = (r, t, c, x, y, z, e) => mesh(geo('t' + [r, t], () => new THREE.TorusGeometry(r, t, 8, 20)), c, x, y, z, e);
function G(...a) { const g = new THREE.Group(); for (const c of a) if (c) g.add(c); return g; }
function rot(m, x, y, z) { m.rotation.set(x || 0, y || 0, z || 0); return m; }
function at(m, x, y, z) { m.position.set(x, y, z); return m; }
function scl(m, x, y, z) { m.scale.set(x, y === undefined ? x : y, z === undefined ? x : z); return m; }
function pivot(x, y, z) { const p = new THREE.Group(); p.position.set(x, y, z || 0); p.userData.pivot = true; return p; }
function ctex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
const GLOW = ctex(64, 64, (x, w) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); });
const SPC = {};
function glow(col, s, x, y, z) { const m = SPC[col] || (SPC[col] = bendSprite(new THREE.SpriteMaterial({ map: GLOW, color: col, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }))); const sp = new THREE.Sprite(m); sp.scale.set(s, s, 1); sp.position.set(x || 0, y || 0, z || 0); return sp; }
const SHADOW = bend(new THREE.MeshBasicMaterial({ map: ctex(64, 64, (x, w) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); }), transparent: true, depthWrite: false }));
function blob(s) { const m = new THREE.Mesh(geo('blob', () => new THREE.PlaneGeometry(1, 1)), SHADOW); m.rotation.x = -Math.PI / 2; m.position.y = .03; m.scale.set(s, s, 1); return m; }

/* Lecture des attributs compressés (quantifiés) des modèles glTF */
function deq(a) { return a; }
function unpack(src) {
  const out = new THREE.BufferGeometry(), idx = src.index;
  const n = idx ? idx.count : src.attributes.position.count;
  for (const name of ['position', 'normal', 'uv', 'color']) {
    const a = src.attributes[name]; if (!a) continue;
    const k = a.itemSize, arr = new Float32Array(n * k);
    let div = 1; if (a.normalized) { const ar = a.array || (a.data && a.data.array); div = ar instanceof Int8Array ? 127 : ar instanceof Uint8Array ? 255 : ar instanceof Int16Array ? 32767 : ar instanceof Uint16Array ? 65535 : 1; }
    for (let i = 0; i < n; i++) { const j = idx ? idx.getX(i) : i; for (let c = 0; c < k; c++) { let val = c === 0 ? a.getX(j) : c === 1 ? a.getY(j) : c === 2 ? a.getZ(j) : a.getW(j); val /= div; if (a.normalized && div !== 1) val = Math.max(val, -1); arr[i * k + c] = val; } }
    out.setAttribute(name, new THREE.BufferAttribute(arr, k));
  }
  return out;
}
/* Fusion par matériau : un maillage par matériau pour un groupe fixe */
const VCM = bend(new THREE.MeshLambertMaterial({ vertexColors: true }));
const VCU = bend(new THREE.MeshBasicMaterial({ vertexColors: true }));
function mergeGroup(root, colorMode) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert(), tm = new THREE.Matrix4();
  const buckets = new Map(), kill = [];
  root.traverse(o => {
    if (!o.isMesh || o.isSkinnedMesh) return;
    let mat = o.material; if (Array.isArray(mat)) return;
    let key = mat, vc = false;

  const sliding = P.slide > 0 && P.y < .3;
  if (P.ride === 'foot') {
    if (P.act && P.y < .02 && P.vy <= 0 && P.slide <= 0 && P.pow !== 'vol' && !(P.act === 'hit' && (P.actT -= dt) > 0)) { P.act = ''; heroAnim('Running_A', { fade: .1 }); }
    hero.userData.mixer.timeScale = P.act ? 1 : clamp(v / 15, .9, 1.5);
  } else {
    if (pRide.userData.legs) pRide.userData.legs.forEach((l, i) => l.rotation.x = Math.sin(T * 12 + i * 1.6) * .8);
    if (P.ride === 'boat') { pRide.rotation.z = Math.sin(T * 2.4) * .05; pRide.position.y = sliding ? -.25 : Math.sin(T * 2) * .06; const mast = pRide.userData.mast; if (mast) mast.rotation.x += ((sliding ? 1.45 : 0) - mast.rotation.x) * Math.min(1, dt * 14); }
    else { hero.scale.y = sliding ? .55 : .9; }
  }
  if (wings && wings.visible) { wings.children[0].rotation.y = Math.sin(T * 14) * .5; wings.children[1].rotation.y = -Math.sin(T * 14) * .5; }
  player.visible = P.inv > 0 && P.pow !== 'inv' ? Math.floor(T * 16) % 2 === 0 : true;

  for (const o of obs) {
    if (o.dead) continue;
    const z0 = dist - o.d;
    if (o.rise && !o.risen) { if (z0 > -38) { o.risen = true; o.m.userData.play('Spawn_Ground', { once: true, duration: 1.1 }); o.riseT = 1.1; } else { o.m.visible = z0 > -60; continue; } }
    if (o.riseT > 0) { o.riseT -= dt; if (o.riseT <= 0) o.m.userData.play('Walking_A'); }
    if (o.mv && !(o.riseT > 0)) o.d -= o.mv * dt;
    if (o.shift) o.x = Math.sin(T * o.sp + o.ph) * LANE;
    const z = dist - o.d; o.m.position.z = z; o.m.position.x = o.x;
    if (o.anim === 'gallop' && o.m.userData.legs) o.m.userData.legs.forEach((l, i) => l.rotation.x = Math.sin(T * 14 + i * 1.6) * .8);
    else if (o.anim === 'bob') o.m.position.y = Math.sin(T * 2.5 + o.ph) * .12;
    else if (o.anim === 'hover') o.m.position.y = .2 + Math.sin(T * 3 + o.ph) * .15;
    else if (o.anim === 'sway') o.m.rotation.z = Math.sin(T * 2 + o.ph) * .2;
    else if (o.anim === 'bats') o.m.children.forEach((b, i) => { if (b.userData.wings) { b.userData.wings[0].rotation.z = Math.sin(T * 22 + i) * .7; b.userData.wings[1].rotation.z = -Math.sin(T * 22 + i) * .7; } });
    if (z > 14) { o.dead = true; drop(o.m); continue; }
    if (Math.abs(o.x - P.x) < 1.05 && Math.abs(z) < o.len / 2 + .35 && P.pow !== 'inv' && P.pow !== 'vol') {
      const touch = o.kind === 'block' || (o.kind === 'low' && P.y < .95) || (o.kind === 'high' && !sliding);
      if (touch) hit(o);
    }
  }
  obs = obs.filter(o => !o.dead);

  for (const c of coins) {
    c.m.rotation.y += dt * 4; let z = dist - c.d;
    if (P.pow === 'aim' && z > -22 && z < 2) { c.x += (P.x - c.x) * Math.min(1, dt * 8); c.y += (P.y + .9 - c.y) * Math.min(1, dt * 8); c.d -= (c.d - dist) * Math.min(1, dt * 6); z = dist - c.d; }
    c.m.position.set(c.x, c.y, z);
    if (Math.abs(c.x - P.x) < .95 && Math.abs(z) < .9 && Math.abs(c.y - (P.y + .85)) < 1.25) { c.dead = true; drop(c.m); const n = P.pow === 'x2' ? 2 : 1; S.coins += n; runCoins += n; sfx('coin'); sparkle(c.x, c.y + .2, z); }
    else if (z > 2.5) { c.dead = true; drop(c.m); }
  }
  coins = coins.filter(c => !c.dead);
  for (const p of pickups) {
    const z = dist - p.d; p.m.position.z = z; p.m.rotation.y += dt * 2; p.m.position.y = p.y + Math.sin(T * 3) * .15;
    if (Math.abs(p.x - P.x) < 1 && Math.abs(z) < 1 && Math.abs(p.y - (P.y + .85)) < 1.5) { p.dead = true; drop(p.m); activatePow(p.k); burst(p.x, p.y, 0, POW[p.k].col, 12); }
    else if (z > 10) { p.dead = true; drop(p.m); }
  }
  pickups = pickups.filter(p => !p.dead);

  if (P.pow === 'pis') {
    P.shootT -= dt;
    if (P.shootT <= 0) {
      let tgt = null, best = 1e9;
      for (const o of obs) { const z = dist - o.d; if (!o.dead && !o.civ && Math.abs(o.x - P.x) < 1.1 && z < -2 && z > -45 && -z < best) { best = -z; tgt = o; } }
      if (tgt) { const m = G(rb(.12, .12, .5, .05, 0xe8eef4, 0, 0, 0, .9), glow(0xd0e8ff, .8)); m.position.set(P.x, P.y + 1.2, -.6); world.add(m); bullets.push({ m, d: dist + .6, tgt, x: P.x, y: P.y + 1.2 }); P.shootT = .45; sfx('shot'); }
    }
  }
  for (const b of bullets) {
    b.d += (v + 45) * dt; b.m.position.set(b.x, b.y, dist - b.d);
    if (b.tgt && !b.tgt.dead && b.d >= b.tgt.d) { b.tgt.dead = true; drop(b.tgt.m); burst(b.tgt.m.position.x, 1, b.tgt.m.position.z, 0xe8eef4, 12); S.coins += 3; runCoins += 3; b.dead = true; drop(b.m); }
    else if (b.d - dist > 60) { b.dead = true; drop(b.m); }
  }
  bullets = bullets.filter(b => !b.dead);
  $('#progI').style.width = (prog * 100) + '%';
  if (mode === 'run' && dist >= ch.len) arrive();
}

/* ---------- Caméra, HUD, boucle ---------- */
let lastHearts = -1, lastCoinsShown = -1, last = performance.now();
function updateHUD() {
  if (P.hearts !== lastHearts) { lastHearts = P.hearts; let h = ''; for (let i = 0; i < maxHearts(); i++) h += `<span class="${i < P.hearts ? '' : 'off'}">♥</span>`; $('#hearts').innerHTML = h; }
  if (S.coins !== lastCoinsShown) { lastCoinsShown = S.coins; $('#coins').textContent = S.coins; }
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; T += dt;
  if (mode === 'run') updateRun(dt);
  else if (mode === 'boss') updateBoss(dt);
  if (mode !== 'pause') for (const m of mixers) m.update(dt);
  for (const p of parts) { p.life -= dt; p.vy -= (p.spark ? 0 : 12) * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += (p.vz + (mode === 'run' ? v : 0)) * dt; if (p.spark) { const k = Math.max(0, p.life / .25) * .9; p.m.scale.set(k, k, 1); } if (p.life <= 0) { p.dead = true; scene.remove(p.m); } }
  parts = parts.filter(p => !p.dead);
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('#hint').style.opacity = 0; }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').style.opacity = 0; }
  if (shake > 0) shake -= dt;
  const sk = shake > 0 ? (Math.random() - .5) * shake : 0;
  if (CH[cur] && CH[cur].boss) { cam.position.set(P.x * .4 + sk, 3.4, 7.2); cam.lookAt(P.x * .2, 1.8, -14); }
  else { const by = P.ride === 'boat' ? .3 : P.ride === 'cart' ? .9 : 0; cam.position.set(P.x * .5 + sk, 4.9 + by + P.y * .5 + sk, 7.6 + by); cam.lookAt(P.x * .4, 2.2 + by + P.y * .4, -18); }
  sky.position.copy(cam.position); mountains.position.set(cam.position.x, 0, cam.position.z);
  if (mode === 'run' || mode === 'boss') updateHUD();
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

/* ---------- Écrans ---------- */
let pausedFrom = null, shopBack = 'title';
function screen(html) { $('#scr').style.background = ''; hintTimer = 0; $('#hint').style.opacity = 0; const s = $('#scr'); s.innerHTML = html; s.hidden = false; s.scrollTop = 0; const b = s.querySelector('.btn'); if (b && !isTouch) b.focus({ preventScroll: true }); }
function hideScreen() { $('#scr').hidden = true; $('#scr').innerHTML = ''; }
function mapHTML(now) { let h = '<div class="map" aria-hidden="true">'; for (let i = 0; i < CH_COUNT; i++) h += `<span class="${i < now ? 'on' : i === now ? 'now' : ''}"></span>`; return h + '</div>'; }
function legendHTML() { return '<div class="legend">' + POW_ORDER.map(k => `<div><b><span class="sw" style="background:${POW[k].css}"></span>${POW[k].name}</b><span>${POW[k].desc}${k === 'pis' ? ' À débloquer en boutique, à partir de la traversée.' : ''}</span></div>`).join('') + '</div>'; }
function title() {
  mode = 'title'; $('#hud').hidden = true; $('#power').hidden = true; renderReserve();
  prepChapter(0);
  const r = Math.min(S.reached, CH_COUNT - 1);
  screen(`<div class="card"><div class="eyebrow">Londres · 1897</div><h1>La Traque<span>de Dracula</span></h1>
    <p>Le comte a fui l'Angleterre pour son château des Carpates. Traverse Londres, la mer, la Transylvanie et ses morts, et va lui planter un pieu dans le cœur.</p>
    ${S.reached ? mapHTML(r) : ''}
    <div class="btns">${r > 0 ? `<button class="btn" data-intro="${r}">Reprendre · ${CH[r].boss ? 'Combat final' : 'Chapitre ' + (r + 1)}</button><button class="btn alt" data-intro="0">Recommencer à Londres</button>` : '<button class="btn" data-intro="0">Commencer la traque</button>'}
    ${S.reached > 0 ? '<button class="btn alt" data-pick>Choisir un chapitre</button>' : ''}<button class="btn shopb" data-shop="title">Boutique · ${S.coins} pièces</button><button class="btn alt" data-help>Les bonus</button></div>
    <div class="keys"><b>${isTouch ? 'Glisser ←  →' : '←  →'}</b><span>changer de voie</span><b>${isTouch ? 'Glisser ↑' : '↑ ou Espace'}</b><span>sauter</span><b>${isTouch ? 'Glisser ↓' : '↓'}</b><span>glisser dessous</span></div><p class="small">Modèles 3D : KayKit (Kay Lousberg) et Quaternius, en licence libre CC0.</p></div>`);
}
function pickChapter() {
  const max = S.wins > 0 ? CH_COUNT - 1 : Math.min(S.reached, CH_COUNT - 1);
  let h = '<div class="card"><div class="eyebrow">Rejouer</div><h2>Choisis un chapitre</h2><p>Chaque chapitre va plus vite que le précédent.</p><div class="btns">';
  CH.forEach((c, i) => { if (i <= max) h += `<button class="btn ${i === max ? '' : 'alt'}" data-intro="${i}">${c.boss ? 'Combat final' : (i + 1) + '. ' + c.name}</button>`; });
  h += '<button class="btn alt" data-home>Retour</button></div></div>'; screen(h);
}
function fanfare() { if (!AC) return; const notes = [[523, 0], [659, .14], [784, .28], [1047, .42], [784, .7], [1047, .84], [1319, 1.0], [1568, 1.3]]; notes.forEach(([f, t]) => { tone(f, .22, 'square', .05, 0, t); tone(f / 2, .22, 'triangle', .05, 0, t); }); tone(1047, .8, 'triangle', .06, 0, 1.55); tone(1319, .8, 'triangle', .05, 0, 1.55); tone(1568, .8, 'triangle', .05, 0, 1.55); }
function celebrate() {
  hemi.color.setHex(0xffe0b0); hemi.intensity = 1.3; sun.color.setHex(0xffd090); sun.intensity = 1.1; scene.fog.color.setHex(0x6a3a2a);
  let n = 0; const iv = setInterval(() => { if (mode !== 'win' || n++ > 14) { clearInterval(iv); return; } const x = rnd(-4, 4), y = rnd(3, 6), z = rnd(-16, -6); burst(x, y, z, pick([0xffc83a, 0xe0284a, 0x5ab0ff, 0xb6ff6a, 0xffffff]), 22, 6); sfx('coin'); }, 260);
}
function help() {
  screen(`<div class="card"><div class="eyebrow">Les bonus</div><h2>Ce que font les bonus</h2>
    <p>Ramasse-les en route : ce sont les cristaux colorés. Tu peux aussi les acheter en boutique et les garder en réserve : un bouton rond apparaît à droite pendant la course, touche-le au bon moment.</p>
    ${legendHTML()}
    <div class="btns"><button class="btn shopb" data-shop="title">Boutique · ${S.coins} pièces</button><button class="btn alt" data-home>Retour</button></div></div>`);
}
function intro(i) {
  prepChapter(i); mode = 'intro'; const ch = CH[i];
  screen(`<div class="card"><div class="eyebrow">${ch.boss ? 'Combat final' : 'Chapitre ' + (i + 1)}</div><h2>${ch.name}</h2><p>${ch.goal}</p>${mapHTML(i)}
    <div class="btns"><button class="btn" data-go="${i}">${ch.boss ? 'Affronter le comte' : 'Courir'}</button><button class="btn shopb" data-shop="intro">Boutique · ${S.coins} pièces</button><button class="btn alt" data-help2>Les bonus</button><button class="btn alt" data-home>Accueil</button></div></div>`);
}
function togglePause() {
  if (mode === 'run' || mode === 'boss') {
    pausedFrom = mode; mode = 'pause'; renderReserve();
    screen(`<div class="card"><h2>Pause</h2>${legendHTML()}<div class="btns"><button class="btn" data-resume>Reprendre</button><button class="btn alt" data-sound>Son : ${S.sound ? 'oui' : 'non'}</button><button class="btn alt" data-intro="${cur}">Recommencer le chapitre</button><button class="btn alt" data-home>Accueil</button></div></div>`);
  } else if (mode === 'pause') resume();
}
function resume() { hideScreen(); mode = pausedFrom; renderReserve(); last = performance.now(); }
const HEART_COST = [400, 900, 1600];
const LV_COST = [200, 450, 800, 1300];
const RES_COST = { vol: 150, inv: 150, aim: 100, x2: 120, pis: 200 };
const GUN_COST = 500;
function shop(back) {
  if (back) shopBack = back;
  const hl = S.hearts;
  let h = `<div class="card"><div class="eyebrow">Boutique du chasseur</div><h2>Équipement</h2><div class="purse">${S.coins} pièces</div>
    <div class="section">Bonus</div><p class="small">Améliorer : le bonus dure plus longtemps chaque fois que tu le ramasses. Réserve : tu l'emportes et tu le déclenches quand tu veux avec son bouton rond.</p><div class="shop">`;
  for (const k of POW_ORDER) {
    const lv = S.lv[k], locked = k === 'pis' && !S.gun;
    h += `<div class="item"><b><span class="sw" style="background:${POW[k].css}"></span>${POW[k].name}</b><span>${POW[k].desc}</span>`;
    if (locked) h += `<span>Le pistolet n'apparaît en route qu'une fois acheté, et jamais dans Londres.</span><div class="acts"><button data-gun ${S.coins < GUN_COST ? 'disabled' : ''}>Débloquer · ${GUN_COST}</button></div></div>`;
    else h += `<div class="lv">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</div><span>Durée : ${powDur(k)} s · en réserve : ${S.res[k]}</span>
      <div class="acts"><button data-lv="${k}" ${lv >= 4 || S.coins < LV_COST[lv] ? 'disabled' : ''}>${lv >= 4 ? 'Niveau max' : 'Améliorer · ' + LV_COST[lv]}</button><button data-res="${k}" ${S.coins < RES_COST[k] ? 'disabled' : ''}>+1 réserve · ${RES_COST[k]}</button></div></div>`;
  }
  h += `</div><div class="section">Cœurs</div><div class="shop"><div class="item"><b>Cœur supplémentaire</b><span>${maxHearts()} cœurs par chapitre${hl < 3 ? ', ' + (maxHearts() + 1) + ' au niveau suivant' : ' (maximum)'}.</span><div class="acts"><button data-heart ${hl >= 3 || S.coins < HEART_COST[hl] ? 'disabled' : ''}>${hl >= 3 ? 'Maximum' : 'Acheter · ' + HEART_COST[hl]}</button></div></div></div>
    <div class="section">Personnages</div><div class="shop">`;
  for (const k in SKINS) {
    const s = SKINS[k], own = S.skins.includes(k);
    const label = S.skin === k ? 'Choisi' : own ? 'Choisir' : s.price < 0 ? 'Battre le comte' : 'Acheter · ' + s.price;
    h += `<div class="item ${S.skin === k ? 'sel' : ''}"><b><span class="sw" style="background:${SKIN_COL[k]}"></span>${s.name}</b><div class="acts"><button data-skin="${k}" ${S.skin === k || (!own && (s.price < 0 || S.coins < s.price)) ? 'disabled' : ''}>${label}</button></div></div>`;
  }
  h += `</div><div class="btns"><button class="btn" data-back>Retour</button></div></div>`;
  const st = $('#scr').scrollTop; screen(h); if (back === undefined) $('#scr').scrollTop = st;
}
$('#scr').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; ensureAudio(); const d = b.dataset;
  if (d.go !== undefined) go(+d.go);
  else if (d.intro !== undefined) intro(+d.intro);
  else if (d.home !== undefined) title();
  else if (d.help !== undefined) help();
  else if (d.pick !== undefined) pickChapter();
  else if (d.help2 !== undefined) { screen(`<div class="card"><div class="eyebrow">Les bonus</div><h2>Ce que font les bonus</h2><p>Ramasse les cristaux colorés en route, ou achète des bonus en réserve dans la boutique.</p>${legendHTML()}<div class="btns"><button class="btn" data-intro="${cur}">Retour</button></div></div>`); }
  else if (d.resume !== undefined) resume();
  else if (d.sound !== undefined) { S.sound = !S.sound; save(); b.textContent = 'Son : ' + (S.sound ? 'oui' : 'non'); }
  else if (d.shop !== undefined) shop(d.shop);
  else if (d.back !== undefined) { if (shopBack === 'intro' || shopBack === 'over') intro(cur); else title(); }
  else if (d.heart !== undefined) { const c = HEART_COST[S.hearts]; if (S.coins >= c) { S.coins -= c; S.hearts++; save(); sfx('buy'); shop(); } }
  else if (d.lv) { const k = d.lv, c = LV_COST[S.lv[k]]; if (S.lv[k] < 4 && S.coins >= c) { S.coins -= c; S.lv[k]++; save(); sfx('buy'); shop(); } }
  else if (d.res) { const k = d.res, c = RES_COST[k]; if (S.coins >= c) { S.coins -= c; S.res[k]++; save(); sfx('buy'); shop(); } }
  else if (d.gun !== undefined) { if (!S.gun && S.coins >= GUN_COST) { S.coins -= GUN_COST; S.gun = true; save(); sfx('buy'); shop(); } }
  else if (d.skin) { const s = SKINS[d.skin]; if (!S.skins.includes(d.skin) && s.price > 0 && S.coins >= s.price) { S.coins -= s.price; S.skins.push(d.skin); sfx('buy'); } if (S.skins.includes(d.skin)) { S.skin = d.skin; save(); buildPlayer(P.ride); if (P.ride === 'foot') hero.userData.play('Idle'); } shop(); }
});

resize();
requestAnimationFrame(t => { last = t; frame(t); });
loadAssets(p => { const vals = FILES.map(f => p[f] || 0); const el = $('#loadI'); if (el) el.style.width = Math.round(vals.reduce((a, b) => a + b, 0) / FILES.length * 100) + '%'; })
  .then(() => title())
  .catch(err => { console.error(err); screen(`<div class="card"><h2>Chargement impossible</h2><p>Les modèles du jeu n'ont pas pu être chargés. Vérifie ta connexion puis recharge la page.</p><p class="small">${String(err && err.message || err).replace(/[<>&]/g, '')}</p></div>`); });
})();
</script>
