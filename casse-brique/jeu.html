<!doctype html>
<html lang="fr">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casse-Brique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout : écran de borne centré au format portrait, barre de scores au-dessus. Look arcade sombre unique. */
:root{
  --bg:#06070e; --panel:#111430; --line:#2b3166; --fg:#eef2ff; --dim:#8b93bb;
  --gold:#ffd23f; --hot:#ff4f6d; --ok:#38e07b; --cyan:#4fd7ff;
  --pix:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--pix)}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 56px);display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{width:min(100%, calc((100dvh - 130px) * 3 / 4), 480px);display:flex;justify-content:space-between;font-size:10px;gap:8px}
.hud span{display:flex;flex-direction:column;gap:6px}
.hud small{color:var(--dim);font-size:7px;letter-spacing:1px}
.hud b{font-weight:400;font-variant-numeric:tabular-nums}
.screen{position:relative;width:min(100%, calc((100dvh - 130px) * 3 / 4), 480px);aspect-ratio:3/4;border:3px solid var(--line);box-shadow:0 0 28px rgba(80,120,255,.22);background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center;background:rgba(5,6,15,.86);font-size:9px;line-height:1.9}
.ov[hidden]{display:none}
.ov h1,.ov h2{margin:0;font-weight:400;color:var(--gold);text-shadow:3px 3px 0 var(--hot);line-height:1.3;text-wrap:balance}
.ov h1{font-size:22px}.ov h2{font-size:15px}
.ov p{margin:0;color:var(--dim);max-width:30em}
button{font-family:var(--pix);font-size:10px;color:var(--fg);background:var(--panel);border:2px solid var(--ok);padding:12px 16px;cursor:pointer}
button:hover,button:focus-visible{background:var(--ok);color:var(--bg);outline:none}
</style>
</head>
<body>
<div class="hud">
  <span><small>SCORE</small><b id="hScore">000000</b></span>
  <span><small>NIVEAU</small><b id="hLvl">1</b></span>
  <span><small>VIES</small><b id="hLives">3</b></span>
  <span><small>RECORD</small><b id="hBest">000000</b></span>
</div>
<div class="screen">
  <canvas id="cv" aria-label="Zone de jeu Casse-Brique"></canvas>
  <div class="ov" id="ov">
    <h1>CASSE-BRIQUE</h1>
    <p>Glisse le doigt ou la souris pour bouger la raquette. Touche l'écran pour lancer la balle. Clavier : flèches et Espace.</p>
    <button id="go" type="button">JOUER</button>
  </div>
</div>
<script>
(() => {
'use strict';
const W = 240, H = 320;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
const ov = document.getElementById('ov');
const $ = id => document.getElementById(id);
const ROWS_COL = ['#ff4f6d','#ff8a3d','#ffd23f','#38e07b','#4fd7ff','#9b7bff'];
const COLS = 10, BW = 22, BH = 9, BX0 = 10, BY0 = 40;
let best = 0; try { best = +localStorage.getItem('casse-brique-best') || 0; } catch(e){}

let S, state = 'title', keys = {}, last = 0;
const pad = n => String(n).padStart(6,'0');

/* ---------- son ---------- */
let AC = null;
function tone(f, d, type='square', v=.04){
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function initAudio(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){ AC = null; } }

/* ---------- niveaux ---------- */
function buildBricks(n){
  const b = [], rows = Math.min(4 + n, 8);
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++){
    // motifs simples qui changent selon le niveau
    if (n % 3 === 2 && (r + c) % 2 === 0) continue;
    if (n % 3 === 0 && c > 1 && c < 8 && r === 2) continue;
    const tough = n >= 2 && r < Math.min(n - 1, 3) ? 2 : 1;
    b.push({ x:BX0 + c*BW, y:BY0 + r*(BH+2), hp:tough, col:ROWS_COL[r % ROWS_COL.length] });
  }
  return b;
}
function newGame(){ S = { score:0, lives:3, lvl:1, pw:44, px:W/2, parts:[] }; startLevel(); }
function startLevel(){
  S.bricks = buildBricks(S.lvl);
  S.speed = 150 + S.lvl*14;
  resetBall();
}
function resetBall(){ S.ball = { x:S.px, y:H - 30, vx:0, vy:0, r:3, stuck:true }; }
function launch(){
  const b = S.ball; if (!b.stuck) return;
  const a = (-60 - Math.random()*60) * Math.PI/180;
  b.vx = Math.cos(a)*S.speed; b.vy = Math.sin(a)*S.speed; b.stuck = false; tone(660,.06);
}

/* ---------- commandes ---------- */
function toLocal(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => { initAudio(); if (state === 'play'){ S.px = toLocal(e); launch(); } });
cv.addEventListener('pointermove', e => { if (state === 'play') S.px = toLocal(e); });
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' '){ e.preventDefault(); initAudio(); if (state === 'play') launch(); else start(); }
});
addEventListener('keyup', e => { keys[e.key] = false; });
$('go').addEventListener('click', () => { initAudio(); start(); });
function start(){ if (state === 'over' || state === 'title') newGame(); state = 'play'; ov.hidden = true; }

function show(html){ ov.innerHTML = html; ov.hidden = false; const g = ov.querySelector('button'); if (g) g.addEventListener('click', () => { initAudio(); start(); }); }

function burst(x, y, col){ for (let i = 0; i < 8; i++){ const a = Math.random()*6.28, v = 30 + Math.random()*50; S.parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:.5, col }); } }

/* ---------- boucle ---------- */
function update(dt){
  if (keys.ArrowLeft) S.px -= 220*dt;
  if (keys.ArrowRight) S.px += 220*dt;
  S.px = Math.max(S.pw/2, Math.min(W - S.pw/2, S.px));
  const b = S.ball, py = H - 20;
  if (b.stuck){ b.x = S.px; b.y = py - 5; }
  else {
    const steps = 3;
    for (let s = 0; s < steps; s++){
      b.x += b.vx*dt/steps; b.y += b.vy*dt/steps;
      if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); tone(330,.03); }
      if (b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); tone(330,.03); }
      if (b.y < 20 + b.r){ b.y = 20 + b.r; b.vy = Math.abs(b.vy); tone(330,.03); }
      // raquette : l'angle dépend du point d'impact
      if (b.vy > 0 && b.y + b.r >= py && b.y + b.r <= py + 6 && Math.abs(b.x - S.px) <= S.pw/2 + b.r){
        const k = (b.x - S.px) / (S.pw/2), a = (-90 + k*60) * Math.PI/180, sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp; b.y = py - b.r; tone(440,.05);
      }
      for (const br of S.bricks){
        if (br.hp <= 0) continue;
        if (b.x + b.r > br.x && b.x - b.r < br.x + BW - 2 && b.y + b.r > br.y && b.y - b.r < br.y + BH){
          const ox = Math.min(b.x + b.r - br.x, br.x + BW - 2 - (b.x - b.r));
          const oy = Math.min(b.y + b.r - br.y, br.y + BH - (b.y - b.r));
          if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
          br.hp--;
          if (br.hp <= 0){ S.score += 10*S.lvl; burst(br.x + BW/2, br.y + BH/2, br.col); tone(880,.05); }
          else { S.score += 5; tone(520,.05); }
          const sp = Math.min(Math.hypot(b.vx,b.vy)*1.006, 330), k = sp / Math.hypot(b.vx,b.vy);
          b.vx *= k; b.vy *= k;
          break;
        }
      }
    }
    // éviter une trajectoire trop horizontale
    if (Math.abs(b.vy) < 50) b.vy = 50*Math.sign(b.vy || -1);
    if (b.y > H + 10){
      S.lives--; tone(160,.35,'sawtooth',.06);
      if (S.lives <= 0) return gameOver();
      resetBall();
    }
  }
  if (S.bricks.every(br => br.hp <= 0)){
    S.score += 100*S.lvl; S.lvl++; [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f,.1), i*90));
    startLevel();
  }
  for (const p of S.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.t -= dt; }
  S.parts = S.parts.filter(p => p.t > 0);
}
function gameOver(){
  state = 'over';
  const rec = S.score > best; if (rec){ best = S.score; try { localStorage.setItem('casse-brique-best', best); } catch(e){} }
  show(`<h2>PARTIE TERMINÉE</h2><p>SCORE ${pad(S.score)} · NIVEAU ${S.lvl}${rec ? '<br><span style="color:var(--ok)">NOUVEAU RECORD</span>' : ''}</p><button type="button">REJOUER</button>`);
}

function draw(){
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#2b3166'; ctx.fillRect(0,18,W,2);
  if (!S) return;
  for (const br of S.bricks){
    if (br.hp <= 0) continue;
    ctx.fillStyle = br.col; ctx.fillRect(br.x, br.y, BW - 2, BH);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(br.x, br.y, BW - 2, 2);
    if (br.hp > 1){ ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(br.x + 3, br.y + 4, BW - 8, 2); }
  }
  ctx.fillStyle = '#eef2ff'; ctx.fillRect(Math.round(S.px - S.pw/2), H - 20, S.pw, 5);
  ctx.fillStyle = '#4fd7ff'; ctx.fillRect(Math.round(S.px - S.pw/2), H - 20, 4, 5); ctx.fillRect(Math.round(S.px + S.pw/2 - 4), H - 20, 4, 5);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(S.ball.x - 2), Math.round(S.ball.y - 2), 5, 5);
  for (const p of S.parts){ ctx.fillStyle = p.col; ctx.fillRect(p.x|0, p.y|0, 2, 2); }
  if (S.ball.stuck && state === 'play'){
    ctx.fillStyle = '#8b93bb'; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
    ctx.fillText('TOUCHE POUR LANCER', W/2, H - 50);
  }
  $('hScore').textContent = pad(S.score); $('hLvl').textContent = S.lvl; $('hLives').textContent = S.lives;
  $('hBest').textContent = pad(Math.max(best, S.score));
}
function frame(t){
  const dt = Math.min((t - last)/1000, .033); last = t;
  if (state === 'play') update(dt);
  draw(); requestAnimationFrame(frame);
}
$('hBest').textContent = pad(best);
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
<a href="index.html" id="arcadeBack" aria-label="Retour à SOArcade" style="position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:9999;font:600 12px/1 system-ui,sans-serif;color:#fff;background:rgba(10,10,20,.78);border:1px solid rgba(255,255,255,.35);padding:8px 10px;text-decoration:none;border-radius:4px">◀ Menu</a>
</body>
</html>
